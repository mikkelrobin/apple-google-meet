name: Signed release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed:
    runs-on: macos-15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: bash Scripts/test.sh
      - name: Sign, notarize and package
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          GOOGLE_CLIENT_DATA: ${{ secrets.GOOGLE_CLIENT_JSON_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${CERT:?Missing Apple certificate}" "${TEAM_ID:?Missing team ID}"
          : "${APPLE_APP_PASSWORD:?Missing notarization password}"
          TEMP_DIR="$(mktemp -d)"
          KEYCHAIN="$TEMP_DIR/release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          trap 'security delete-keychain "$KEYCHAIN" || true; rm -rf "$TEMP_DIR"' EXIT
          printf '%s' "$CERT" | base64 --decode > "$TEMP_DIR/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$TEMP_DIR/certificate.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          export MODE=signed
          export NOTARY_PROFILE=CalendarMeetCI NOTARY_KEYCHAIN="$KEYCHAIN"
          if [[ -n "$GOOGLE_CLIENT_DATA" ]]; then
            printf '%s' "$GOOGLE_CLIENT_DATA" | base64 --decode > "$TEMP_DIR/client.json"
            export GOOGLE_CLIENT_JSON="$TEMP_DIR/client.json"
          fi
          xcrun notarytool store-credentials "$NOTARY_PROFILE" --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$KEYCHAIN"
          bash Scripts/build.sh
          bash Scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CalendarMeet-SIGNED-NOTARIZED
          path: dist/*
      - name: Prepare release for final real-account Calendar validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.4.0-signed.${GITHUB_RUN_NUMBER}" dist/* --draft \
            --target "$GITHUB_SHA" --title 'Calendar Meet 0.4.0 — Signed and notarized' \
            --notes 'Developer ID signed and notarized. Complete the real-account Calendar checklist in docs/SETUP.md before publishing to colleagues.'
